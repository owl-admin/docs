name: Deploy docs image to VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Docker image to GHCR"]
    types: [completed]
    branches: [master]
  repository_dispatch:
    types: [deploy-docs-vps]

concurrency:
  group: deploy-docs-vps
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (docker pull + recreate)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            export IMAGE=ghcr.io/owl-admin/docs:master
            /opt/owladmin-deploy/deploy-docs.sh
